# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 1 # reduce cold starts; this reserves billable capacity
  maxInstances: 4
  concurrency: 80
  memoryMiB: 512

env:
  # NEXT_PUBLIC_* values are inlined at build time — BUILD availability is required
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: supabase-public-url
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: supabase-anon-key
    availability: [BUILD, RUNTIME]

  # Privileged Cloud Secret Manager reference — never a plain value or build input.
  # Provision and grant every referenced secret using the reviewed README procedure.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: supabase-service-role-key
    availability: [RUNTIME]
