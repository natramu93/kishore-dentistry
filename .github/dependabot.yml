version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - vitest
          - jsdom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
